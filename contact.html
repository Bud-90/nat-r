<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Nat'R</title>
<meta name="description" content="Contactez Nat'R, atelier de céramique, pour toute question ou inscription aux cours de modelage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="brand">Nat'R</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="medias.html">Médias</a>
      <a href="contact.html" class="current">Contact</a>
    </nav>
  </div>
</header>

<div class="page-header wrap">
  <h1>Contact</h1>
  <p>Pour toute question ou inscription, écrivez, appelez, ou passez par le formulaire ci-dessous.</p>
</div>

<section>
  <div class="wrap">
    <div class="contact-grid">
      <a class="contact-item" href="mailto:nathalieremy27@gmail.com">
        <span class="label">Email</span>
        <span class="value">nathalieremy27@gmail.com</span>
      </a>
      <a class="contact-item" href="tel:+32473603734">
        <span class="label">Téléphone</span>
        <span class="value">+32 473 60 37 34</span>
      </a>
    </div>

    <p class="or-divider">— ou passez directement par ce formulaire —</p>
    <form class="contact-form" id="contactForm">
      <input type="hidden" name="access_key" value="e61328f9-c0b6-46f9-86b4-3124f4165b86">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
      <div class="field">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Votre email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">Envoyer</button>
      <p class="form-note" id="formNote"></p>
    </form>
  </div>
</section>

<footer>
  Nat'R — Atelier de céramique
</footer>

<script>
  const form = document.getElementById('contactForm');
  const note = document.getElementById('formNote');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    note.textContent = 'Envoi en cours...';
    note.className = 'form-note';
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const data = await res.json();
      if (data.success) {
        note.textContent = 'Message envoyé, merci ! Réponse au plus vite.';
        note.className = 'form-note success';
        form.reset();
      } else {
        throw new Error(data.message || 'Erreur inconnue');
      }
    } catch (err) {
      note.textContent = "Une erreur est survenue, réessayez ou écrivez directement par email.";
      note.className = 'form-note error';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
