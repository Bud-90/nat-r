<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Nat'R</title>
<meta name="description" content="Contactez Nat'R, atelier de céramique, pour toute question ou inscription aux cours de modelage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Jost:wght@300;400;500;600&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 180 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nat'R">
        <circle cx="90" cy="60" r="46" fill="none" stroke="#bd6039" stroke-width="2.5"/>
        <circle cx="93" cy="60" r="35" fill="none" stroke="#bd6039" stroke-width="2"/>
        <circle cx="88" cy="61" r="24" fill="none" stroke="#bd6039" stroke-width="2"/>
        <circle cx="91" cy="60" r="12" fill="none" stroke="#9c4c2c" stroke-width="2"/>
        <text x="90" y="128" text-anchor="middle" font-family="'Marck Script', cursive" font-size="34" fill="#372a20">Nat'R</text>
      </svg>
    </a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="medias.html">Médias</a>
      <a href="contact.html" class="current">Contact</a>
    </nav>
  </div>
</header>

<div class="page-header wrap">
  <h1>Contact</h1>
  <p>Pour toute question ou inscription, utilisez le formulaire ci-dessous.</p>
</div>

<section>
  <div class="wrap">
    <form class="contact-form" id="contactForm">
      <input type="hidden" name="access_key" value="e61328f9-c0b6-46f9-86b4-3124f4165b86">
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
      <div class="field">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Votre email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">Envoyer</button>
      <p class="form-note" id="formNote"></p>
    </form>
  </div>
</section>

<footer>
  Nat'R : +32 473 60 37 34
</footer>

<script>
  const form = document.getElementById('contactForm');
  const note = document.getElementById('formNote');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    note.textContent = 'Envoi en cours...';
    note.className = 'form-note';
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form)))
      });
      const data = await res.json();
      if (data.success) {
        note.textContent = 'Message envoyé, merci ! Réponse au plus vite.';
        note.className = 'form-note success';
        form.reset();
      } else {
        throw new Error(data.message || 'Erreur inconnue');
      }
    } catch (err) {
      note.textContent = "Une erreur est survenue, réessayez ou écrivez directement par email.";
      note.className = 'form-note error';
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
