<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nat'R — Bientôt en ligne</title>
<meta name="description" content="Le site de l'atelier de céramique Nat'R arrive bientôt.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --clay:#bd6039; --clay-dark:#9c4c2c; --cream:#f7efe2; --paper:#fbf6ee;
    --ink:#372a20; --ink-soft:#5c4d3f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Jost', sans-serif;background:var(--cream);color:var(--ink);
    text-align:center;padding:24px;
  }
  .card{max-width:420px;}
  .brand svg{height:130px;width:auto;display:block;margin:0 auto 28px;}
  h1{font-size:1.6rem;margin:0 0 12px;color:var(--ink);}
  p{color:var(--ink-soft);font-size:1rem;line-height:1.6;margin:0 0 22px;}
  .phone{
    display:inline-block;text-decoration:none;font-weight:600;color:#fff;
    background:var(--clay);padding:12px 26px;border-radius:999px;font-size:.95rem;
  }
  .phone:hover{background:var(--clay-dark);}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 180 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nat'R">
        <circle cx="90" cy="60" r="46" fill="none" stroke="#bd6039" stroke-width="2.5"/>
        <circle cx="93" cy="60" r="35" fill="none" stroke="#bd6039" stroke-width="2"/>
        <circle cx="88" cy="61" r="24" fill="none" stroke="#bd6039" stroke-width="2"/>
        <circle cx="91" cy="60" r="12" fill="none" stroke="#e07b3d" stroke-width="4"/>
        <text x="90" y="128" text-anchor="middle" font-family="'Marck Script', cursive" font-size="34" fill="#372a20">Nat'R</text>
      </svg>
    </div>
    <h1>Bientôt en ligne</h1>
    <p>Le site de l'atelier de céramique Nat'R est en cours de préparation. En attendant, n'hésitez pas à nous appeler.</p>
    <a class="phone" href="tel:+32473603734">+32 473 60 37 34</a>
  </div>
</body>
</html>
